/* Goldin Institute alumni network page: charcoal top nav, navy page, one large map with a white filter card and a row of
   focus-area filters along its bottom edge, black footer. UI components are MUI (Material UI); the map is MapLibre GL with a
   Protomaps (OpenStreetMap) basemap in Goldin navy. The palette is set out in the script (const C). Single dark look. */
:root {
  --page: #0A1216;     /* bg/page */
  --raised: #191B1E;   /* bg/raised: top nav */
  --surface: #FFFFFF;  /* cards */
  --ink: #0A1216;      /* text on cards */
  --muted: #8E9AA0;    /* muted on dark */
  --accent: #F37023;
  --accent-deep: #D65608;
  color-scheme: dark;
}
body { background: var(--page); color: #fff; }

const inRing = ([x, y], r) => { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const [xi, yi] = r[i], [xj, yj] = r[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
const inGeom = (p, g) => (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).some(poly => inRing(p, poly[0]) && !poly.slice(1).some(h => inRing(p, h)));

// The world view shows the whole height of the map (84°N to 60°S) and only scrolls sideways; zoomed in, you can pan anywhere
// inside that band. Web Mercator y runs 0 (north) to 1 (south).
const mercY = lat => (1 - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) / Math.PI) / 2;
const latOf = y => 360 / Math.PI * Math.atan(Math.exp((1 - 2 * y) * Math.PI)) - 90;
const Y_TOP = mercY(84), Y_BOTTOM = mercY(-60);
const fitZoom = h => Math.log2(h / (512 * (Y_BOTTOM - Y_TOP)));

        layout: { 'text-field': ['get', 'label'], ...text(12), 'text-offset': [0, 1], 'text-anchor': 'top', 'text-optional': true }, paint: halo });
      // hubs: white discs with an orange centre
      map.addLayer({ id: 'hub-dot', type: 'circle', source: 'hubs', paint: { 'circle-color': C.white, 'circle-radius': 8, 'circle-stroke-color': INK, 'circle-stroke-width': 2 } });
      map.addLayer({ id: 'hub-core', type: 'circle', source: 'hubs', paint: { 'circle-color': ORANGE, 'circle-radius': 3.5 } });

      // name each Chicago site after the community area it sits in
      setAreaOf(Object.fromEntries(LOCATIONS.filter(l => l.site).map(l => [l.id, ov.areas.features.find(f => inGeom([l.lon, l.lat], f.geometry))?.properties.name])));
      ready.current = true; setTick(t => t + 1);
    });

    for (const h of HUBS) {
      const tag = document.createElement('button');
      tag.type = 'button'; tag.className = 'hubtag';
      tag.addEventListener('click', () => focusHub(h));
      new maplibregl.Marker({ element: tag, anchor: 'left', offset: [14, 0] }).setLngLat([h.lon, h.lat]).addTo(map);
      hubEls.current[h.id] = tag;
    }
    const zoomClass = () => el.classList.toggle('far', map.getZoom() > 8.5);
    map.on('zoom', zoomClass); zoomClass();
    map.on('move', () => setTick(t => t + 1)); // keeps the callout attached to its place

    // hover and tap for details
    const LAYERS = ['clusters', 'loc', 'hub-dot', 'areas-fill', 'countries-fill'];
    const hoverState = { src: null, id: null };
    const setHover = (src, id) => {
      if (hoverState.src === src && hoverState.id === id) return;
      if (hoverState.src) map.setFeatureState({ source: hoverState.src, id: hoverState.id }, { hover: false });
      Object.assign(hoverState, { src, id });
      if (src) map.setFeatureState({ source: src, id }, { hover: true });
    };
    const describe = (f, lngLat) => {
      if (f.layer.id === 'loc') return { kind: 'loc', key: 'l' + f.properties.id, loc: LOCATIONS[f.properties.id] };
      if (f.layer.id === 'clusters') return { kind: 'cluster', key: 'c' + f.properties.cluster_id, n: f.properties.point_count, lngLat: f.geometry.coordinates };
      if (f.layer.id === 'hub-dot') return { kind: 'hub', key: 'h' + f.properties.id, hub: hubById[f.properties.id] };
      if (f.layer.id === 'areas-fill') return { kind: 'area', key: 'a' + f.properties.name, name: f.properties.name, lngLat: [lngLat.lng, lngLat.lat] };
      return { kind: 'country', key: 'k' + f.properties.name, name: f.properties.name, lngLat: [lngLat.lng, lngLat.lat] };
    };
    const at = e => ready.current ? map.queryRenderedFeatures(e.point, { layers: LAYERS }).filter(f => f.layer.id !== 'countries-fill' || map.getZoom() < 6.5)[0] : null;
    map.on('mousemove', e => {
      const f = at(e), d = f && describe(f, e.lngLat);
      map.getCanvas().style.cursor = f ? 'pointer' : '';
      setHover(f && (f.layer.id === 'areas-fill' || f.layer.id === 'countries-fill') ? f.source : null, f?.id);
      // points keep their callout still; areas and countries let it follow the pointer
      setPick(p => p?.pinned ? p : d && p?.key === d.key && !d.lngLat ? p : d);
    });
    map.on('mouseout', () => { setHover(null); setPick(p => p?.pinned ? p : null); });
    map.on('click', async e => {
      const f = at(e);
      if (!f) { setPick(null); return; }
      if (f.layer.id === 'clusters') {
        const z = await map.getSource('locations').getClusterExpansionZoom(f.properties.cluster_id);
        map.easeTo({ center: f.geometry.coordinates, zoom: z + .3 }); setPick(null); return;
      }
      if (f.layer.id === 'hub-dot') { focusHub(hubById[f.properties.id]); return; }
      setPick({ ...describe(f, e.lngLat), pinned: true });
    });
    return () => map.remove();
  }, []);

  // filters → map
  useEffect(() => {
    const map = mapRef.current;
    if (!ready.current) return;
    map.getSource('locations').setData(fc(shown.map(l => pt(l.lon, l.lat, { id: l.id, label: placeName(l, areaOf) }))));
    const names = ['literal', countries.map(atlasName)];
    map.setFilter('countries-fill', ['in', ['get', 'name'], names]);
    map.setFilter('countries-line', ['in', ['get', 'name'], names]);
    const siteAreas = ['literal', shown.filter(l => l.site).map(l => areaOf[l.id]).filter(Boolean)];
    const isSite = ['in', ['get', 'name'], siteAreas], hovered = ['boolean', ['feature-state', 'hover'], false];
    map.setPaintProperty('areas-fill', 'fill-color', ['case', isSite, ORANGE, C.white]);
    map.setPaintProperty('areas-fill', 'fill-opacity', ['case', isSite, ['case', hovered, .75, .62], hovered, .08, 0]);
    for (const h of HUBS) {
      const n = shown.filter(l => l.hub === h.id).length;
      hubEls.current[h.id].innerHTML = `${h.name}<b>${n}</b>`;
      hubEls.current[h.id].setAttribute('aria-label', `${h.name} hub, ${plural(n, 'alumni location', 'alumni locations')}`);
    }
    setPick(null);
  }, [shown, areaOf, ready.current]);

  // the map stays mounted while the list shows; give it its size back on return
  useEffect(() => {
    if (view !== 'map' || page !== 'network' || !mapRef.current) return;
    mapRef.current.resize();
    if (!placed.current) home(mapRef.current, false);
  }, [view, page]);
  const goPage = p => { setPage(p); window.scrollTo(0, 0); };

  // World view: the full map height, turned so the area right of the filter card is centred on Africa and Europe
  function worldView(map = mapRef.current) {
    const el = map.getContainer(), zoom = fitZoom(el.clientHeight), degPx = 512 * 2 ** zoom / 360;
    const panel = wideRef.current ? 332 : 0;
    return { center: [12 - panel / 2 / degPx, latOf((Y_TOP + Y_BOTTOM) / 2)], zoom };
  }
  function home(map = mapRef.current, animate = true) {
    if (!map.getContainer().clientHeight) return; // hidden behind the apply page; placed once it shows
    placed.current = true;
    animate ? map.flyTo({ ...worldView(map), duration: 1400 }) : map.jumpTo(worldView(map));
  }
  function chicago() {
    mapRef.current.fitBounds(CHICAGO_BOX, { padding: { top: 40, bottom: 80, left: wideRef.current ? 352 : 30, right: 40 }, duration: 2000 });
  }
  function goPlace(p) { if (!p) return; setPlace(p); setPick(null); p === 'world' ? home() : chicago(); }
  function focusHub(h) {
    setView('map');
    if (h.id === 'chi') { goPlace('chicago'); return; }
    setPlace('world');
    mapRef.current.flyTo({ center: [h.lon, h.lat], zoom: Math.max(mapRef.current.getZoom(), 4.2), duration: 1600 });
  }
  function showOnMap(l) {
    setView('map');
    requestAnimationFrame(() => {
      mapRef.current.resize();
      mapRef.current.flyTo({ center: [l.lon, l.lat], zoom: l.site ? 12 : Math.max(mapRef.current.getZoom(), 6), duration: 1600 });
      setPick({ kind: 'loc', key: 'l' + l.id, loc: l, pinned: true });
    });
  }
  const clear = () => { setCohort('all'); setFocus([]); };
  const filtered = cohort !== 'all' || focus.length > 0;

  /* ----- pieces ----- */
  const strong = n => html`<${Box} component="b" sx=${{ color: 'text.primary', fontWeight: 700 }}>${n}<//>`;
  const status = html`<${Meta} sx=${{ fontSize: 14 }} aria-live="polite">
    ${strong(shown.length)} alumni ${shown.length === 1 ? 'location' : 'locations'} in ${strong(countries.length)} ${countries.length === 1 ? 'country' : 'countries'}${wide ? ', supported by three regional hubs.' : ''}<//>`;
  const viewToggle = html`<${ToggleButtonGroup} exclusive fullWidth=${wide} size="small" value=${view} onChange=${(e, v) => v && setView(v)} aria-label="Show alumni as"
      sx=${wide ? {} : { flex: 'none' }}>
    <${ToggleButton} value="map">Map<//><${ToggleButton} value="list">List<//><//>`;
  const cohortSelect = html`<${TextField} select fullWidth size="small" id="cohort" label="Cohort" value=${cohort} onChange=${e => setCohort(e.target.value)}
    SelectProps=${{ MenuProps: { PaperProps: { elevation: 8, sx: { borderRadius: '10px' } } } }}>
    ${COHORTS.map(([id, label]) => html`<${MenuItem} key=${id} value=${id} sx=${{ fontSize: 14 }}>${label}<//>`)}<//>`;

  // Focus areas: a row of filter chips along the bottom of the map (or above the cards in the list)
  const focusRow = overlay => html`<${Box} role="group" aria-label="Filter by focus area" sx=${{
      display: 'flex', alignItems: 'center', gap: 1, overflowX: 'auto', scrollbarWidth: 'none', '&::-webkit-scrollbar': { display: 'none' },
      ...(overlay ? { position: 'absolute', zIndex: 2, left: 16, right: 16, bottom: 16, p: 1, borderRadius: '12px', bgcolor: 'rgba(10,18,22,.78)', backdropFilter: 'blur(8px)',
        boxShadow: `inset 0 0 0 1px ${C.ink600}` } : {}) }}>
    <${Typography} sx=${{ flex: 'none', fontSize: 13, fontWeight: 600, color: C.ink200, pl: overlay ? 1 : 0, pr: .5 }}>Focus<//>
    ${FOCUS.map(([id, label]) => {
      const on = focus.includes(id);
      return html`<${Chip} key=${id} label=${label} clickable aria-pressed=${on} onClick=${() => setFocus(f => on ? f.filter(x => x !== id) : [...f, id])}
        sx=${{ flex: 'none', height: 34, borderRadius: '8px', fontSize: 13, fontWeight: 600, '& .MuiChip-label': { px: 1.5 },
          ...(on ? { bgcolor: C.orange500, color: C.white, '&:hover': { bgcolor: C.orange600 } }
                 : { bgcolor: 'transparent', color: C.white, boxShadow: `inset 0 0 0 1px ${C.ink500}`, '&:hover': { bgcolor: C.ink700 } }) }} />`;
    })}
    ${focus.length > 0 && html`<${Button} size="small" onClick=${() => setFocus([])} sx=${{ flex: 'none', color: C.ink200, fontWeight: 600, '&:hover': { bgcolor: C.ink700 } }}>Clear<//>`}
  <//>`;

  const panel = html`<${Paper} id="panel" sx=${{
      p: wide ? 3 : 2, borderRadius: '12px', boxShadow: '0 8px 24px rgba(0,0,0,.28)', display: 'grid', gridTemplateColumns: 'minmax(0, 1fr)', gap: 2.5, minWidth: 0,
      ...(view === 'map' && wide ? { position: 'absolute', zIndex: 2, top: 16, left: 16, width: 316, maxHeight: 'calc(100% - 100px)', overflowY: 'auto' } : {}),
      ...(view === 'list' && wide ? { position: 'sticky', top: 16, mt: 2, ml: 2, width: 316 } : {}),
    }}>
    ${wide ? html`<${Box}>
        <${Typography} component="h1" sx=${{ fontSize: 22, fontWeight: 800, lineHeight: 1.25, letterSpacing: '-.01em', mb: .75 }}>Goldin alumni network<//>
        ${status}
      <//>` : html`<${Stack} direction="row" alignItems="center" justifyContent="space-between" gap=${1.5}>${status}${viewToggle}<//>`}
    ${wide && viewToggle}
    ${wide && html`<${Box}>
      <${Typography} sx=${{ fontSize: 13, fontWeight: 700, color: 'text.secondary', mb: .5 }}>Regional hubs<//>
      <${List} disablePadding>
        ${HUBS.map((h, i) => html`<${ListItemButton} key=${h.id} onClick=${() => focusHub(h)}
            sx=${{ px: 1, mx: -1, py: 1, borderRadius: '8px', borderTop: i ? `1px solid ${C.mist100}` : 0, gap: 1.5, '&:hover': { bgcolor: C.mist50 } }}>
          <${Box} sx=${{ minWidth: 0 }}>
            <${Typography} sx=${{ fontSize: 15, fontWeight: 700, lineHeight: 1.3 }}>${h.name}<//>
            <${Meta}>${h.role}<//>
          <//>
          <${Typography} sx=${{ ml: 'auto', fontSize: 15, fontWeight: 700, fontVariantNumeric: 'tabular-nums' }} aria-label=${plural(shown.filter(l => l.hub === h.id).length, 'location', 'locations')}>
            ${shown.filter(l => l.hub === h.id).length}<//>
        <//>`)}
      <//>
    <//>`}
    ${cohortSelect}
    ${filtered && html`<${Button} size="small" onClick=${clear} sx=${{ justifySelf: 'start', mt: -1, px: 1, color: C.orange600 }}>Clear all filters<//>`}
  <//>`;

  const map = mapRef.current;
  let callout = null;
  if (pick && map && view === 'map') {
    const ll = pick.loc ? [pick.loc.lon, pick.loc.lat] : pick.hub ? [pick.hub.lon, pick.hub.lat] : pick.lngLat;
    const p = map.project(ll), below = p.y < 240;
    const title = t => html`<${Typography} sx=${{ fontSize: 17, fontWeight: 800, lineHeight: 1.3 }}>${t}<//>`;
    const rows = list => html`<${Box} sx=${{ mt: 1.5, borderTop: `1px solid ${C.mist100}` }}>${list.map(l => html`
      <${Stack} key=${l.id} direction="row" justifyContent="space-between" alignItems="center" gap=${2} sx=${{ py: .75, borderBottom: `1px solid ${C.mist100}` }}>
        <${Typography} sx=${{ fontSize: 14, fontWeight: 600 }}>${placeName(l, areaOf)}<//><${Tag}>${FOCUS_NAME[l.focus]}<//>
      <//>`)}<//>`;
    let body;
    if (pick.kind === 'loc') {
      const l = pick.loc;
      body = html`${title(placeName(l, areaOf))}
        <${Meta}>${placeSub(l)} · ${COHORT_NAME[l.cohort]}<//>
        <${Stack} direction="row" gap=${.75} sx=${{ mt: 1.5 }}><${Tag}>${FOCUS_NAME[l.focus]}<//><//>
        <${Meta} sx=${{ mt: 1.5, fontSize: 12 }}>Supported by the ${hubById[l.hub].name} hub<//>`;
    } else if (pick.kind === 'cluster') {
      body = html`${title(plural(pick.n, 'alumni location', 'alumni locations'))}<${Meta}>Click to zoom in<//>`;
    } else if (pick.kind === 'hub') {
      body = html`${title(pick.hub.name)}<${Meta}>${pick.hub.role} · ${plural(shown.filter(l => l.hub === pick.hub.id).length, 'location', 'locations')}<//>`;
    } else if (pick.kind === 'area') {
      const here = shown.filter(l => l.site && areaOf[l.id] === pick.name);
      body = html`${title(pick.name)}<${Meta}>Chicago community area<//>
        ${here.length > 0 && html`<${Stack} direction="row" gap=${.75} flexWrap="wrap" sx=${{ mt: 1.5 }}><${Tag} tone="orange">Peace Fellows site<//>${here.map(l => html`<${Tag} key=${l.id}>${FOCUS_NAME[l.focus]}<//>`)}<//>`}`;
    } else {
      const here = shown.filter(l => atlasName(l.country) === pick.name), pct = Math.round(here.length / Math.max(1, shown.length) * 100);
      body = html`${title(here[0]?.country || pick.name)}
        <${Meta}>${plural(here.length, 'alumni location', 'alumni locations')}${here[0] ? ` · ${hubById[here[0].hub].name} hub` : ''}<//>
        <${Stack} direction="row" justifyContent="space-between" sx=${{ mt: 1.5, mb: .75 }}><${Meta} sx=${{ fontSize: 12 }}>Share of the network<//><${Typography} sx=${{ fontSize: 12, fontWeight: 700 }}>${pct}%<//><//>
        <${LinearProgress} variant="determinate" value=${pct} aria-label="Share of the network" sx=${{ height: 6, borderRadius: 3, bgcolor: C.mist100 }} />
        ${rows(here)}`;
    }
    callout = html`<${Paper} role="status" sx=${{
        position: 'absolute', left: Math.round(p.x), top: Math.round(p.y), zIndex: 3, pointerEvents: pick.pinned ? 'auto' : 'none',
        transform: below ? 'translate(-50%, 18px)' : 'translate(-50%, calc(-100% - 16px))',
        width: 'max-content', minWidth: 220, maxWidth: 300, p: 2, borderRadius: '10px', boxShadow: '0 12px 32px rgba(0,0,0,.4)',
      }}>${body}<//>`;
  }

  const ctrl = { bgcolor: C.white, borderRadius: '10px', p: '3px', boxShadow: '0 6px 18px rgba(0,0,0,.28)' };
  const mapFrame = html`<${Box} sx=${{ position: 'relative', height: wide ? 'max(560px, calc(100vh - 64px - 48px - 36px))' : '70vh', minHeight: 440,
      borderRadius: '12px', overflow: 'hidden', boxShadow: `inset 0 0 0 1px ${C.ink700}`, bgcolor: '#0B151A', display: view === 'map' ? 'block' : 'none' }}>
    <${Box} ref=${mapEl} sx=${{ width: '100%', height: '100%' }} role="region" aria-label="Map of alumni locations. Drag to explore; hold Shift and scroll to zoom." />
    <${Stack} direction="row" gap=${1} sx=${{ position: 'absolute', top: 16, right: 16, zIndex: 2 }}>
      <${ToggleButtonGroup} exclusive size="small" value=${place} onChange=${(e, v) => goPlace(v)} aria-label="Map area" sx=${{ ...ctrl, bgcolor: C.white }}>
        <${ToggleButton} value="world">World<//><${ToggleButton} value="chicago">Chicago<//>
      <//>
      <${Paper} sx=${{ ...ctrl, display: 'flex', gap: '3px' }}>
        <${IconButton} size="small" aria-label="Zoom in" onClick=${() => map?.zoomIn()} sx=${{ color: C.slate700, borderRadius: '8px', width: 32, height: 32, '&:hover': { bgcolor: C.mist100 } }}><${Icon} d="M8 3v10M3 8h10" /><//>
        <${IconButton} size="small" aria-label="Zoom out" onClick=${() => map?.zoomOut()} sx=${{ color: C.slate700, borderRadius: '8px', width: 32, height: 32, '&:hover': { bgcolor: C.mist100 } }}><${Icon} d="M3 8h10" /><//>
      <//>
    <//>
    ${focusRow(true)}
    ${callout}
  <//>`;
  const mapNotes = view === 'map' && html`<${Stack} direction=${{ xs: 'column', sm: 'row' }} justifyContent="space-between" gap=${.5} sx=${{ fontSize: 12, color: C.ink300, mt: -1.5 }}>
    <span>Drag to explore. Hold Shift and scroll to zoom.</span>
    <span>Map data © <${Link} href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" color="inherit">OpenStreetMap<//> contributors · <${Link} href="https://protomaps.com" target="_blank" rel="noopener" color="inherit">Protomaps<//></span>
  <//>`;

  const cards = html`<${Box} sx=${{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: 2, alignContent: 'start', minWidth: 0 }}>
    ${shown.length === 0 && html`<${Paper} sx=${{ p: 3, borderRadius: '12px', gridColumn: '1 / -1' }}>
      <${Typography} sx=${{ fontWeight: 800, fontSize: 18 }}>No alumni locations match these filters<//>
      <${Meta} sx=${{ mt: .5 }}>Try another cohort or focus area.<//>
      <${Button} variant="contained" size="small" onClick=${clear} sx=${{ mt: 2 }}>Clear all filters<//><//>`}
    ${[...shown].sort((a, b) => a.country.localeCompare(b.country) || placeName(a, areaOf).localeCompare(placeName(b, areaOf))).map(l => html`
      <${Card} key=${l.id} component="article" sx=${{ display: 'flex', flexDirection: 'column' }}>
        <${CardContent} sx=${{ p: 2.5, display: 'grid', gap: .5, justifyItems: 'start', flex: 1 }}>
          <${Tag} tone="orange">${COHORT_NAME[l.cohort]}<//>
          <${Typography} component="h3" sx=${{ fontSize: 20, fontWeight: 800, lineHeight: 1.25, mt: 1.5 }}>${placeName(l, areaOf)}<//>
          <${Meta} sx=${{ fontSize: 14 }}>${placeSub(l)}<//>
          <${Box} sx=${{ mt: 1.5 }}><${Tag}>${FOCUS_NAME[l.focus]}<//><//>
        <//>
        <${CardActions} sx=${{ px: 2.5, py: 1.5, borderTop: `1px solid ${C.mist100}`, justifyContent: 'space-between' }}>
          <${Meta}>${hubById[l.hub].name} hub<//>
          <${Button} size="small" onClick=${() => showOnMap(l)} sx=${{ color: C.orange600, fontWeight: 700, mr: -1 }}>View on map<//>
        <//>
      <//>`)}
  <//>`;

  return html`
    <${AppBar} position="static" elevation=${0} sx=${{ bgcolor: '#191B1E', color: C.white }}>
      <${Toolbar} sx=${{ ...gutter, maxWidth: 1280, width: '100%', mx: 'auto', justifyContent: 'space-between' }}>
        <${Link} href="https://goldininstitute.org/" target="_blank" rel="noopener" underline="none" color="inherit" sx=${{ display: 'flex', alignItems: 'center', gap: 1.25 }}>
          <svg viewBox="0 0 40 40" width="32" height="32" aria-hidden="true"><path d="M33 12.5A16 16 0 1 0 36 22" fill="none" stroke=${ORANGE} stroke-width="5.5" stroke-linecap="round"/><path d="M19 22h17" stroke=${ORANGE} stroke-width="5.5" stroke-linecap="round"/></svg>
          <${Typography} sx=${{ fontWeight: 900, fontSize: 13, letterSpacing: '.02em', lineHeight: 1.05, textTransform: 'uppercase' }}>Goldin<br/>Institute<//>
        <//>
        <${Button} variant="contained" href="https://goldininstitute.org/donate/" target="_blank" rel="noopener" sx=${{ fontWeight: 800, letterSpacing: '.08em', px: 2.75 }}>Donate<//>
      <//>
    <//>
    ${page === 'apply' && html`<${ApplyPage} wide=${wide} onBack=${() => goPage('network')} />`}
    <${Box} component="main" sx=${{ ...gutter, py: 3, display: page === 'network' ? 'block' : 'none' }}>
      <${Box} sx=${{ maxWidth: 1240, mx: 'auto', position: 'relative', display: 'grid', gap: wide ? 3 : 1.5, alignItems: 'start',
          gridTemplateColumns: wide && view === 'list' ? '332px minmax(0, 1fr)' : 'minmax(0, 1fr)' }}>
        ${panel}
        ${mapFrame}
        ${mapNotes}
        ${view === 'list' && html`<${Box} sx=${{ minWidth: 0, pt: wide ? 1 : 0 }}>
          <${Box} sx=${{ position: 'sticky', top: 0, zIndex: 3, bgcolor: C.ink900, py: 1, mb: 1 }}>${focusRow(false)}<//>
          ${cards}
        <//>`}
      <//>
      <${JoinSection} wide=${wide} onApply=${() => goPage('apply')} />
    <//>
    <${Box} component="footer" sx=${{ ...gutter, bgcolor: C.ink950, color: C.ink300, fontSize: 13, textAlign: 'center', py: 3.5, mt: 3 }}>
      © 2026 Goldin Institute · <${Link} href="https://goldininstitute.org/" target="_blank" rel="noopener" underline="hover" sx=${{ color: C.white, fontWeight: 700 }}>goldininstitute.org<//>
      <${Typography} sx=${{ fontSize: 12, mt: .75, color: C.ink500 }}>Prototype. Alumni locations and focus areas are sample data.<//>
    <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${ThemeProvider} theme=${theme}><${CssBaseline} /><${App} /><//>`);
</script>

</html>
